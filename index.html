<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romantic Cinematic</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Nhạc intro -->
  <audio id="introSound" src="audio.mp3"></audio>

  <!-- Nhạc scene -->
  <audio id="music" src="music.mp3" loop></audio>

  <canvas id="canvas"></canvas>

  <!-- START -->
  <div id="start" class="page active" onclick="startStory()">
    <h2>Nhấn vào màn hình nha 💖</h2>
  </div>

  <!-- INTRO -->
  <div id="intro" class="page">
    <h2 id="introText"></h2>
  </div>

  <!-- NAME -->
  <div id="namePage" class="page">
    <h2 id="typeText">Nhập tên đi nè</h2>
    <input id="nameInput" placeholder="Chào bạn nhỏ nhé...">
    <button onclick="checkName()">Gửi</button>
  </div>

  <div id="memory" class="page"></div>
  <div id="timeline" class="page"></div>
  <div id="scene" class="page"></div>
  <div id="silence" class="page"></div>
  <div id="love" class="page"></div>

  <script src="script.js"></script>

</body>
</html>
